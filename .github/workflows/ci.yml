# 每个 PR 的自动检查（agents 规则 C54），按 agents/模板/ci.yml 建立。
# 分支保护：把这里的 unit 检查设为 staging 和 main 的"必须通过"，并勾选 Do not allow bypassing the above settings。本仓库是公开仓库，可以开启。
# 原则：不需要任何密钥（外部服务用替身）；用到数据库后，打开下面的 Postgres，在真实数据库上跑（C37）。
# 部署 job（推送到 staging / main、CI 全绿后 wrangler deploy）在建立测试环境那一步加上（平台规范/Cloudflare.md K3）。
name: ci
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 用到 Postgres 时打开：
    # services:
    #   postgres:
    #     image: postgres:16
    #     env: { POSTGRES_PASSWORD: ci }
    #     ports: ['5432:5432']
    #     options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 项目地图和索引检查（C53）
        run: node scripts/check-project-index.mjs
      - run: npm ci
      - name: 中英文文案键名检查
        run: npm run check:messages
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: 构建
        run: npm run build
      - name: Worker 打包检查（不部署，不需要密钥）
        run: npm run deploy:dry -- --env prototype
